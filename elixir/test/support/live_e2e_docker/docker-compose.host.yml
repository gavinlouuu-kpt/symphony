services:
  worker1:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    volumes:
      - ${SYMPHONY_LIVE_DOCKER_AUTHORIZED_KEY}:/run/symphony/ssh/authorized_key.pub:ro
      - ${SYMPHONY_LIVE_DOCKER_AUTH_JSON}:/root/.codex/auth.json:ro
      - ${SYMPHONY_LIVE_DOCKER_CONFIG_TOML}:/run/symphony/codex/config.toml:ro
    environment:
      SYMPHONY_LIVE_WORKER_SSH_PORT: ${SYMPHONY_LIVE_DOCKER_WORKER_1_PORT}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      all_proxy: ${all_proxy:-}
      no_proxy: ${no_proxy:-}

  worker2:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    volumes:
      - ${SYMPHONY_LIVE_DOCKER_AUTHORIZED_KEY}:/run/symphony/ssh/authorized_key.pub:ro
      - ${SYMPHONY_LIVE_DOCKER_AUTH_JSON}:/root/.codex/auth.json:ro
      - ${SYMPHONY_LIVE_DOCKER_CONFIG_TOML}:/run/symphony/codex/config.toml:ro
    environment:
      SYMPHONY_LIVE_WORKER_SSH_PORT: ${SYMPHONY_LIVE_DOCKER_WORKER_2_PORT}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      all_proxy: ${all_proxy:-}
      no_proxy: ${no_proxy:-}
